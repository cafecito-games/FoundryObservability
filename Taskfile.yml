version: '3'

tasks:
  default:
    desc: Run the complete validation gate
    cmds:
      - task: test

  lint:
    desc: Run generic repository hygiene checks
    cmds:
      - prek run --all-files

  test:foundry-script:
    desc: Validate addon structure and FoundryScript diagnostics
    cmds:
      - scripts/test-foundry-script
      - scripts/test-foundry-uids

  test:project:
    desc: Install test-project packages and run project-wiring tests
    cmds:
      - scripts/test-project

  test:ci:
    desc: Validate GitHub Actions workflow contracts
    cmds:
      - scripts/test-ci-workflows

  test:package:
    desc: Build and inspect a distributable addon zip
    cmds:
      - scripts/test-package

  test:sentry-swift:
    desc: Run deterministic Sentry event-mapper XCTest cases
    dir: addons/FoundryObservabilitySentry/FoundryObservabilitySentry
    cmds:
      - swift test

  test:sentry-contract:
    desc: Validate Sentry iOS build and export contracts
    cmds:
      - scripts/test-sentry-ios-build-contract

  test:sentry-android-contract:
    desc: Validate Sentry Android build and export contracts
    cmds:
      - scripts/test-sentry-android-build-contract

  test:
    desc: Run all local validation gates
    deps:
      - lint
      - test:ci
      - test:package
      - test:sentry-swift
      - test:sentry-contract
      - test:sentry-android-contract
    cmds:
      - task: test:project
      - task: test:foundry-script

  package:
    desc: Create distributable FoundryObservability addon zips
    cmds:
      - scripts/package-addon
      - scripts/package-sentry-addon

  package:sentry:
    desc: Create a distributable FoundryObservabilitySentry addon zip
    cmds:
      - scripts/package-sentry-addon

  ios:sentry:
    desc: Build the FoundryObservabilitySentry iOS xcframework
    dir: addons/FoundryObservabilitySentry/FoundryObservabilitySentry
    vars:
      DERIVED_DATA: "{{.ROOT_DIR}}/.build/sentry-xcodebuild"
    cmds:
      - xcodegen generate
      - FOUNDRY_SENTRY_NATIVE_DIR="$PWD" FOUNDRY_SENTRY_DERIVED_DATA="{{.DERIVED_DATA}}"
          ../../../scripts/prepare-foundryswift-binary
      - xcodebuild -resolvePackageDependencies
          -scheme FoundryObservabilitySentry_iOS
          -derivedDataPath "{{.DERIVED_DATA}}"
      - xcodebuild clean
          -scheme FoundryObservabilitySentry_iOS
          -configuration Release
          -derivedDataPath "{{.DERIVED_DATA}}"
      - mkdir -p ../bin/ios
      - xcodebuild build
          -scheme FoundryObservabilitySentry_iOS
          -destination "generic/platform=iOS"
          -configuration Release
          -derivedDataPath "{{.DERIVED_DATA}}"
          -skipPackagePluginValidation -skipMacroValidation
      - xcodebuild build
          -scheme FoundryObservabilitySentry_iOS
          -destination "generic/platform=iOS Simulator"
          -configuration Release
          -derivedDataPath "{{.DERIVED_DATA}}"
          -skipPackagePluginValidation -skipMacroValidation
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - rm -rf ../bin/ios/FoundryObservabilitySentry.xcframework
      - xcodebuild -create-xcframework
          -framework "{{.DERIVED_DATA}}/Build/Products/Release-iphoneos/FoundryObservabilitySentry.framework"
          -framework "{{.DERIVED_DATA}}/Build/Products/Release-iphonesimulator/FoundryObservabilitySentry.framework"
          -output ../bin/ios/FoundryObservabilitySentry.xcframework
      - xcodebuild build
          -scheme FoundryObservabilitySentry_macOS
          -destination "generic/platform=macOS"
          -configuration Release
          -derivedDataPath "{{.DERIVED_DATA}}"
          -skipPackagePluginValidation -skipMacroValidation
          ARCHS=arm64
      - mkdir -p ../bin/macos_arm64
      - rm -rf ../bin/macos_arm64/FoundryObservabilitySentry.framework
      - cp -R "{{.DERIVED_DATA}}/Build/Products/Release/FoundryObservabilitySentry.framework"
          ../bin/macos_arm64/

  android:sentry:
    desc: Build FoundryObservabilitySentry Android AARs
    dir: addons/FoundryObservabilitySentry/AndroidFoundryObservabilitySentry
    cmds:
      - ./gradlew test lintRelease assembleDebug assembleRelease
      - mkdir -p ../bin/android/debug ../bin/android/release
      - cp build/outputs/aar/AndroidFoundryObservabilitySentry-debug.aar ../bin/android/debug/FoundryObservabilitySentry-debug.aar
      - cp build/outputs/aar/AndroidFoundryObservabilitySentry-release.aar ../bin/android/release/FoundryObservabilitySentry-release.aar
