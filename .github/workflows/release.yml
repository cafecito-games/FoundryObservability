name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: "v0.1.0-alpha.8"

jobs:
  build:
    name: Build and verify release
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            current="0.0.0"
          else
            current="${latest#v}"
          fi
          if ! printf '%s\n' "$current" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Latest version '$current' is not valid semver." >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install repository tooling
        run: brew install prek ripgrep

      - name: Install Task
        uses: go-task/setup-task@v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36"

      - name: Make gradlew executable
        run: chmod +x addons/FoundryObservabilitySentry/AndroidFoundryObservabilitySentry/gradlew

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '>=1.26.2'

      - name: Install Anvil
        run: |
          go install github.com/cafecito-games/foundry-tools/cmd/anvil@176f5f7c5909c07c785fe6e1fd21051e0c13c5bf
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Foundry editor
        run: |
          foundry_dir="$RUNNER_TEMP/foundry"
          mkdir -p "$foundry_dir"
          asset="Foundry_${FOUNDRY_VERSION}_macos.universal.zip"
          curl --fail --location \
            "https://github.com/cafecito-games/Foundry/releases/download/${FOUNDRY_VERSION}/${asset}" \
            --output "$foundry_dir/$asset"
          unzip -q "$foundry_dir/$asset" -d "$foundry_dir"
          xattr -dr com.apple.quarantine "$foundry_dir/Foundry.app" || true
          chmod +x "$foundry_dir/Foundry.app/Contents/MacOS/Foundry"
          echo "FOUNDRY_BIN=$foundry_dir/Foundry.app/Contents/MacOS/Foundry" >> "$GITHUB_ENV"

      - name: Verify current Foundry CLI
        run: |
          "$FOUNDRY_BIN" --headless project import --project test_project

      - name: Run validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: task test

      - name: Build Apple Sentry artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: task ios:sentry

      - name: Verify Apple Sentry runtime
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDRYOBSERVABILITY_STRICT_NATIVE_RUNTIME: "1"
        run: scripts/test-project

      - name: Build Android Sentry artifacts
        run: task android:sentry

      - name: Build versioned addon archive
        run: REQUIRE_NATIVE_ARTIFACTS=1 task package VERSION="${{ steps.version.outputs.version }}"

      - name: Verify Sentry native artifact archive
        run: task verify:sentry-package VERSION="${{ steps.version.outputs.version }}"

      - name: Upload release archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archives
          path: |
            dist/FoundryObservability-${{ steps.version.outputs.version }}.zip
            dist/FoundryObservabilitySentry-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archives
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create \
            "${{ needs.build.outputs.tag }}" \
            "dist/FoundryObservability-${{ needs.build.outputs.version }}.zip" \
            "dist/FoundryObservabilitySentry-${{ needs.build.outputs.version }}.zip" \
            --target "${{ needs.build.outputs.commit }}" \
            --title "FoundryObservability ${{ needs.build.outputs.tag }}" \
            --generate-notes
