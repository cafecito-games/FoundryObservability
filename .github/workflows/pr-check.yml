name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-core:
    name: Validate FoundryObservability
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FOUNDRY_VERSION: "v0.1.0-alpha.8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install repository tooling
        run: brew install prek ripgrep

      - name: Install Task
        uses: go-task/setup-task@v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '>=1.26.2'

      - name: Install Anvil
        run: |
          go install github.com/cafecito-games/foundry-tools/cmd/anvil@176f5f7c5909c07c785fe6e1fd21051e0c13c5bf
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Foundry editor
        run: |
          foundry_dir="$RUNNER_TEMP/foundry"
          mkdir -p "$foundry_dir"
          asset="Foundry_${FOUNDRY_VERSION}_macos.universal.zip"
          curl --fail --location \
            "https://github.com/cafecito-games/Foundry/releases/download/${FOUNDRY_VERSION}/${asset}" \
            --output "$foundry_dir/$asset"
          unzip -q "$foundry_dir/$asset" -d "$foundry_dir"
          xattr -dr com.apple.quarantine "$foundry_dir/Foundry.app" || true
          chmod +x "$foundry_dir/Foundry.app/Contents/MacOS/Foundry"
          echo "FOUNDRY_BIN=$foundry_dir/Foundry.app/Contents/MacOS/Foundry" >> "$GITHUB_ENV"

      - name: Verify current Foundry CLI
        run: |
          "$FOUNDRY_BIN" --headless project import --project test_project

      - name: Run core validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: task test:core

  build-apple:
    name: Build Apple Sentry addon
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install repository tooling
        run: brew install ripgrep xcodegen

      - name: Install Task
        uses: go-task/setup-task@v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Apple validation
        run: task test:sentry-apple

      - name: Build Apple artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: task ios:sentry

  build-android:
    name: Build Android Sentry addon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install repository tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36"

      - name: Install Task
        uses: go-task/setup-task@v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make gradlew executable
        run: chmod +x addons/FoundryObservabilitySentry/AndroidFoundryObservabilitySentry/gradlew

      - name: Run Android validation
        run: task test:sentry-android

      - name: Build Android AARs
        run: task android:sentry
